# Synthetic settlement corpus: generate, publish as immutable release assets, validate.
#
#   push to corpus/<name>   create release corpus-<name> (fails if it exists), generate 8 shards in
#                           parallel and upload them as assets, assemble manifest.json + corpus.lock.json,
#                           then validate from the published assets on a fresh runner
#   push to demo10g/**      validate the committed server/data/settlements/{manifest,corpus.lock}.json
#
# Validation streams the full corpus into the checkout, reports logical vs allocated bytes per
# component, regenerates sample days to prove determinism, and runs fail-closed negative tests.
name: corpus

on:
  push:
    branches: ["corpus/**", "demo10g/**"]
    paths:
      - "tools/settlements-corpus/**"
      - "server/data/settlements/*.json"
      - ".github/workflows/corpus.yml"

permissions:
  contents: read

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/heads/corpus/') }}

jobs:
  release:
    if: startsWith(github.ref, 'refs/heads/corpus/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        run: echo "tag=corpus-${GITHUB_REF_NAME#corpus/}" >> "$GITHUB_OUTPUT"
      - name: Create release (never overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; corpus releases are immutable"; exit 1
          fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Synthetic settlement corpus ($TAG)" \
            --notes "Synthetic, deterministic test data generated by tools/settlements-corpus/generate.py at $GITHUB_SHA. No real customer or payment data. Pinned by server/data/settlements/corpus.lock.json."

  generate:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate shard (streamed tar.gz, no expanded files)
        run: |
          python3 --version; nproc; df -B1 --output=avail / | tail -1
          /usr/bin/time -v python3 tools/settlements-corpus/generate.py shard --shard ${{ matrix.shard }} \
            --out "settlements-v1-shard-${{ matrix.shard }}.tar.gz" --manifest-out "shard-${{ matrix.shard }}.json" \
            2> gen.log || { tail -40 gen.log; exit 1; }
          grep -E 'Elapsed|Maximum resident' gen.log
          python3 -c "import json;a=json.load(open('shard-${{ matrix.shard }}.json'))['asset'];print(a)"
      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release.outputs.tag }}" "settlements-v1-shard-${{ matrix.shard }}.tar.gz" -R "$GITHUB_REPOSITORY"
          rm -f "settlements-v1-shard-${{ matrix.shard }}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-manifest-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json
          retention-days: 30

  assemble:
    needs: [release, generate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: shard-manifest-*
          merge-multiple: true
          path: shards
      - name: Assemble manifest + lock
        run: |
          python3 tools/settlements-corpus/generate.py assemble --release-tag "${{ needs.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --out-dir out shards/shard-*.json
          sha256sum out/*.json
      - name: Attach manifest + lock to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" out/manifest.json out/corpus.lock.json -R "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-pins
          path: out/
          retention-days: 90

  validate:
    needs: [assemble]
    if: ${{ !cancelled() && (needs.assemble.result == 'success' || needs.assemble.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEST: server/data/settlements
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.PUBLISH == 'true'
        with:
          name: corpus-pins
          path: server/data/settlements
      - name: Pins present
        id: pins
        run: |
          if [ -f "$DEST/manifest.json" ] && [ -f "$DEST/corpus.lock.json" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "no committed corpus pins on this commit; nothing to validate"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Runner facts
        if: steps.pins.outputs.ok == 'true'
        run: nproc; free -b | sed -n 2p; df -B1 / | tail -1; python3 --version
      - name: Negative tests (fail closed, nothing left behind)
        if: steps.pins.outputs.ok == 'true'
        run: |
          set +e
          M=tools/settlements-corpus/materialize.py
          T="$RUNNER_TEMP/neg"; mkdir -p "$T"
          day=$(python3 -c "import json;print(json.load(open('$DEST/manifest.json'))['files'][3]['settled_on'])")
          # 1 file sha tampered (lock re-pinned to the tampered manifest) -> exit 4, no csv
          python3 - "$DEST" "$T" <<'EOF'
          import hashlib, json, sys
          d, t = sys.argv[1], sys.argv[2]
          m = json.load(open(f"{d}/manifest.json")); m["files"][3]["sha256"] = "0" * 64
          b = (json.dumps(m, indent=1) + "\n").encode(); open(f"{t}/m1.json", "wb").write(b)
          l = json.load(open(f"{d}/corpus.lock.json")); l["manifest_sha256"] = hashlib.sha256(b).hexdigest()
          json.dump(l, open(f"{t}/l1.json", "w"))
          l = json.load(open(f"{d}/corpus.lock.json")); l["assets"][0]["sha256"] = "f" * 64
          json.dump(l, open(f"{t}/l2.json", "w"))
          EOF
          python3 $M --dest "$T/d1" --manifest "$T/m1.json" --lock "$T/l1.json" --only "$day" --min-node-free-bytes 1; rc1=$?
          # 2 asset sha tampered -> exit 4 after the stream ends, the shard's files rolled back
          python3 $M --dest "$T/d2" --lock "$T/l2.json" --only "$day" --min-node-free-bytes 1; rc2=$?
          # 3 budget gate -> exit 3, nothing fetched
          python3 $M --dest "$T/d3" --only "$day" --budget-root "$T" --budget-bytes 1000 --min-node-free-bytes 1; rc3=$?
          # 4 manifest not matching lock -> exit 2
          python3 $M --dest "$T/d4" --manifest "$T/m1.json" --only "$day" --min-node-free-bytes 1; rc4=$?
          left=$(find "$T" -name '*.csv' -o -name '*.part' | wc -l)
          echo "rc1=$rc1 rc2=$rc2 rc3=$rc3 rc4=$rc4 leftover_files=$left"
          [ "$rc1" = 4 ] && [ "$rc2" = 4 ] && [ "$rc3" = 3 ] && [ "$rc4" = 2 ] && [ "$left" = 0 ]
      - name: Full materialization into the checkout (streamed, verified)
        if: steps.pins.outputs.ok == 'true'
        run: |
          mkdir -p evidence
          /usr/bin/time -v python3 tools/settlements-corpus/materialize.py --report evidence/materialize-full.json \
            --budget-root "$GITHUB_WORKSPACE" --budget-bytes 10737418240 --min-node-free-bytes 3000000000 2> evidence/time-full.txt
          rc=$?; grep -E 'Elapsed|Maximum resident|Exit' evidence/time-full.txt; exit $rc
      - name: Idempotent re-run and deep re-verify (every byte hashed again)
        if: steps.pins.outputs.ok == 'true'
        run: |
          python3 tools/settlements-corpus/materialize.py --report evidence/materialize-rerun.json --min-node-free-bytes 1
          python3 -c "import json;r=json.load(open('evidence/materialize-rerun.json'));assert r['compressed_bytes_fetched']==0, r"
          /usr/bin/time -f 'verify_seconds=%e' python3 tools/settlements-corpus/materialize.py --verify-only \
            --report evidence/verify-only.json --min-node-free-bytes 1
      - name: Determinism (regenerate sample days, compare to manifest)
        if: steps.pins.outputs.ok == 'true'
        run: |
          python3 - <<'EOF'
          import json, subprocess, tempfile
          m = json.load(open("server/data/settlements/manifest.json"))
          files = m["files"]
          picks = [files[0], files[len(files) // 2], files[-1]]
          with tempfile.TemporaryDirectory() as t:
              for f in picks:
                  out = subprocess.run(["python3", "tools/settlements-corpus/generate.py", "day", "--date", f["settled_on"],
                                        "--out", f"{t}/x.csv"], check=True, capture_output=True, text=True).stdout
                  got = json.loads(out)
                  assert got["sha256"] == f["sha256"] and got["bytes"] == f["bytes"], (f["settled_on"], got)
                  print("deterministic", f["settled_on"], got["sha256"][:16])
          import hashlib
          gen = hashlib.sha256(open("tools/settlements-corpus/generate.py", "rb").read()).hexdigest()
          print("generator_sha256 matches manifest:", gen == m["generator_sha256"])
          EOF
      - name: Checkout composition (logical vs allocated)
        if: steps.pins.outputs.ok == 'true'
        run: |
          python3 - > evidence/composition.json <<'EOF'
          import json, os, subprocess
          def walk(root, skip=()):
              lg = al = n = 0
              for dp, dn, fn in os.walk(root):
                  dn[:] = [d for d in dn if os.path.join(dp, d) not in skip]
                  for f in fn:
                      st = os.lstat(os.path.join(dp, f)); lg += st.st_size; al += st.st_blocks * 512; n += 1
              return {"files": n, "logical_bytes": lg, "allocated_bytes": al}
          tracked = subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout.split(b"\0")
          lg = al = 0
          for p in filter(None, tracked):
              st = os.lstat(p); lg += st.st_size; al += st.st_blocks * 512
          data = walk("server/data/settlements")
          data_csv = json.load(open("evidence/materialize-full.json"))["dest_csv"]
          git = walk(".git")
          lfs = os.path.isdir(".git/lfs")
          total = walk(".", skip={"./evidence"})
          print(json.dumps({"code_tracked": {"files": len([p for p in tracked if p]), "logical_bytes": lg, "allocated_bytes": al},
                            "git_dir": git, "git_lfs_present": lfs, "data_dir": data, "data_csv": data_csv,
                            "checkout_total_excluding_evidence": total}, indent=1))
          EOF
          cat evidence/composition.json
          git count-objects -vH
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.pins.outputs.ok == 'true'
        with:
          name: corpus-validate-evidence
          path: evidence/
          retention-days: 90
